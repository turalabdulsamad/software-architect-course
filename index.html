code:`func bfs(g map[int][]int, start int) []int {
  seen := map[int]bool{start: true}

    queue = queue[1:]
    order = append(order, cur)

      if !seen[nb] {
        seen[nb] = true
        queue = append(queue, nb)
      }
    }
  }
  return order
}`,q:["Why does BFS find shortest paths in unweighted graphs?",["It explores nodes level by level","It sorts the edges first","It never revisits nodes"],0,"The first time BFS reaches a node is via the fewest edges."],

const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const CK={"l0.0":"go","l0.1":"ds"};
function Bar(p){return h("div",{className:"bar"},h("i",{style:{width:p+"%"}}))}
function RCard({s,P,toggle,auto,open,setOpen,toCourse}){
 const chk=j=>!!P[s.id+"."+j]||auto(s.id+"."+j),n=s.i.filter((_,j)=>chk(j)).length;
 return h("div",{className:"card"},
  h("button",{className:"hd","aria-expanded":open,onClick:setOpen},h("b",null,s.t),
   h("div",{className:"meta"},h("span",null,s.y),h("span",null,n+"/"+s.i.length+" done")),Bar(Math.round(100*n/s.i.length))),
  open&&h("div",{className:"bd"},h("p",{className:"goal"},"Goal: "+s.g),h("h4",null,"Syllabus"),
   s.i.map((x,j)=>{const k=s.id+"."+j,a=auto(k),on=chk(j);
    return h("div",{key:k},h("label",{className:on?"on":""},h("input",{type:"checkbox",checked:on,disabled:a,onChange:()=>toggle(k)}),h("span",null,x)),
     CK[k]&&h("button",{className:"clnk",style:{margin:"0 0 4px 26px"},onClick:toCourse},a?"Completed in course (open)":"Open the course for this item"))}),
   h("h4",null,"Resources"),h("ul",null,s.r.map(x=>h("li",{key:x},x))),
   h("div",{className:"dn"},h("b",null,"Done when: "),s.d)));
}
function Course({S,setS}){
 const [sel,setSel]=useState("g1"),[pick,setPick]=useState({});
 const done=n=>!!(S["q"+n.id]&&S["e"+n.id]);
 const open=n=>n.pre.every(p=>done(N.find(x=>x.id===p)));
 const total=N.filter(done).length,n=N.find(x=>x.id===sel);
 const set=(k,v)=>setS(s=>({...s,[k]:v}));
 const lane=(tr,name)=>h("div",{className:"lane "+tr},h("h3",null,name),N.filter(x=>x.tr===tr).map(x=>{
  const o=open(x),d=done(x);
  return h("button",{key:x.id,className:"node"+(d?" done":""),disabled:!o,"aria-current":sel===x.id,onClick:()=>{setSel(x.id);setTimeout(()=>document.getElementById("panel").scrollIntoView({behavior:"smooth"}),50)}},
   h("span",null,x.t),h("span",{className:"st"},d?"Done":o?"Ready":"Locked"))}));
 const pk=pick[n.id];

  h("h2",null,"Course: Go and Data Structures"),
  h("p",{className:"sub"},"Level 0, checklist items 1 and 2. Pass each quiz and finish the exercise to unlock what comes next."),
  h("div",{className:"cbar"},h("i",{style:{width:100*total/N.length+"%"}})),h("p",{className:"sub"},total+" of "+N.length+" skills complete"),
  h("div",{className:"tree"},lane("go","Go language"),lane("ds","Data structures")),
  h("div",{className:"panel",id:"panel"},h("h2",null,n.t),h("p",null,n.tx),h("pre",null,n.code),
   h("h4",null,"Quick check"),h("p",null,n.q[0]),
   n.q[1].map((o,i)=>h("button",{key:i,className:"opt"+(pk===undefined?"":i===n.q[2]?" ok":i===pk?" bad":""),onClick:()=>{setPick(p=>({...p,[n.id]:i}));if(i===n.q[2])set("q"+n.id,true)}},o)),
   pk!==undefined&&h("p",{className:"fb"},(pk===n.q[2]?"Correct. ":"Not quite, try again. ")+(pk===n.q[2]?n.q[3]:"")),
   S["q"+n.id]&&pk===undefined&&h("p",{className:"fb"},"Quiz passed."),
   h("h4",null,"Exercise (write it in your own editor)"),h("p",null,n.ex),
   h("label",null,h("input",{type:"checkbox",checked:!!S["e"+n.id],onChange:e=>set("e"+n.id,e.target.checked)}),h("span",null,"I finished this exercise and it runs"))),
  h("button",{className:"clnk",onClick:()=>{if(confirm("Reset all progress?")){setS({});setPick({})}}},"Reset progress"));
}

function App(){
 const [S,setS]=useState(()=>ld(cK)),[P,setP]=useState(()=>ld(rK)),[tab,setTab]=useState("levels"),[open,setOpen]=useState({l0:true});
 useEffect(()=>sv(cK,S),[S]);useEffect(()=>sv(rK,P),[P]);
 const cd=n=>!!(S["q"+n.id]&&S["e"+n.id]);
 const lane=tr=>N.filter(x=>x.tr===tr&&x.id!=="c1").every(cd);
 const auto=k=>CK[k]?lane(CK[k]):false;
 const toggle=k=>setP(d=>{const c={...d};c[k]?delete c[k]:c[k]=true;return c});
 const list=tab==="course"?[]:sec(tab),tot=list.reduce((a,s)=>a+s.i.length,0),
  dn=list.reduce((a,s)=>a+s.i.filter((_,j)=>P[s.id+"."+j]||auto(s.id+"."+j)).length,0);
 return h("div",{className:"w"},
  h("h1",null,"Software Architect: Roadmap + Course"),
  h("p",{className:"sub"},"Plan your path on the roadmap, then learn it in the course. Finishing the Go or data structures lane ticks the matching Level 0 item. Progress saves in this browser."),
  h("div",{className:"top"},h("div",{className:"row"},
   h("div",{className:"tabs"},[["levels","Levels 0-6"],["tracks","Gap-fill tracks"],["course","Course: Go + DS"]].map(([k,l])=>h("button",{key:k,className:"tab","aria-pressed":tab===k,onClick:()=>setTab(k)},l))),
   tab!=="course"&&h("span",null,dn+"/"+tot+" complete ("+Math.round(100*dn/tot)+"%)")),tab!=="course"&&Bar(100*dn/tot)),
  tab==="course"?h(Course,{S,setS}):h("div",null,
   list.map(s=>h(RCard,{key:s.id,s,P,toggle,auto,open:!!open[s.id],setOpen:()=>setOpen(o=>({...o,[s.id]:!o[s.id]})),toCourse:()=>{setTab("course");window.scrollTo(0,0)}})),
   h("button",{className:"clnk",onClick:()=>{if(confirm("Reset roadmap progress?"))setP({})}},"Reset roadmap progress"),
   h("p",{className:"note"},"Resource lists come from the author's knowledge and were not link-checked; verify editions and URLs before relying on them.")));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script></body></html>
